<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Background with smooth corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="rgba(253, 230, 138, 0.2)" stroke-width="3"/>

  <!-- Aesthetic Spa Lotus / Botanical Face Profile Emblem -->
  <g transform="translate(256, 235) scale(1.15)">
    <!-- Central Drop / Glow -->
    <path d="M0 -90 C45 -30 75 25 75 75 C75 116 41 150 0 150 C-41 150 -75 116 -75 75 C-75 25 -45 -30 0 -90 Z" fill="url(#rose)" opacity="0.35"/>
    
    <!-- Stylized Lotus Petals -->
    <path d="M0 -75 C35 -20 60 25 60 65 C60 98 33 125 0 125 C-33 125 -60 98 -60 65 C-60 25 -35 -20 0 -75 Z" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Petal -->
    <path d="M-15 35 C-60 15 -95 45 -105 85 C-80 100 -50 95 -20 75 Z" fill="url(#gold)" opacity="0.85"/>

    <!-- Right Petal -->
    <path d="M15 35 C60 15 95 45 105 85 C80 100 50 95 20 75 Z" fill="url(#gold)" opacity="0.85"/>

    <!-- Central Sparkle / Star of Perfection -->
    <path d="M0 -25 Q0 5 30 5 Q0 5 0 35 Q0 5 -30 5 Q0 5 0 -25 Z" fill="#ffffff"/>
    <circle cx="0" cy="5" r="4" fill="#fde68a"/>
  </g>

  <!-- Typography: DERMESTHETIC PRO -->
  <text x="256" y="415" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    DERMESTHETIC
  </text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="8">
    PRO
  </text>
</svg>
